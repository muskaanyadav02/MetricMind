[pytest]
# Run from the backend/ directory:  pytest   (or  python -m pytest)
#
# `pythonpath = .` puts backend/ on sys.path, so `import app...` and
# `from tests.conftest import ...` work whether or not pytest was invoked as a
# module. No Snowflake credentials and no network access are required.
testpaths = tests
pythonpath = .
addopts = -ra
