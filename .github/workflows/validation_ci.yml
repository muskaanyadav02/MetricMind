name: MetricMind Analytics Validation CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas jsonschema

    - name: Run Schema & Data Validation Benchmark Suite
      run: |
        python analytics_validation/validation/test_benchmark_cases.py

    - name: Generate Validation Summary Report
      run: |
        python analytics_validation/reports/generate_report.py