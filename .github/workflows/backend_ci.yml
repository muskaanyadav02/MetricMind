name: MetricMind Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    # The suite uses in-process fakes via FastAPI dependency overrides:
    # no Snowflake credentials, no network access, no external services.
    - name: Run Backend Tests
      working-directory: backend
      run: python -m pytest -q

    - name: Compile Check
      working-directory: backend
      run: python -m compileall app tests
